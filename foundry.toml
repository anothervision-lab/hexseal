[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

# ── `via_ir` IS NOT A PREFERENCE, IT IS THE ONLY THING THAT COMPILES ───────
#
# Written down 15 October 2026 because this line sat here bare and read as a
# choice taken for the sake of the bytecode -- i.e. as a lever somebody could
# pull back to make the ~19-minute build cheaper. It is not a lever.
#
# MEASURED that day, three runs, optimizer already on (item 307 of the working
# journal). Every configuration WITHOUT `via_ir` fails to compile:
#
#   test/** + script/** without via_ir           EXIT 1, Stack too deep
#   test/** only without via_ir                  EXIT 1, Stack too deep
#   src/** only, --skip test --skip script       EXIT 1, Stack too deep
#
#       Compiler error (/solidity/libyul/backends/evm/AsmCodeGen.cpp:63):
#       Stack too deep.
#
# The last row is the one that settles it: even the narrowest possible unit,
# `src/` alone, does not build. So the single huge compilation unit is not the
# price of a preference, and splitting the tree into per-path compiler profiles
# to cut the cost is closed as IMPOSSIBLE rather than as unattractive -- until
# the code that needs the IR pipeline is itself changed. Recheck: item 307.
#
# ⚠️ AND IF A PER-PATH PROFILE EVER BECOMES POSSIBLE, IT IS A CHANGE TO WHAT
# GOES ON CHAIN, NOT A BUILD-TIME TWEAK. Facet initcode is embedded in the
# SCRIPTS: `new ArbiterRegistryFacet()` stands in script/DeployFull.s.sol:274
# and in six more live cut scripts (measured 15 October 2026 by enumerating
# script/*.sol; fifteen more sit in script/archive/). The creation code the
# broadcast deploys is compiled as part of the SCRIPT's unit, not read back
# from out/ArbiterRegistryFacet.sol/ArbiterRegistryFacet.json -- so a different
# profile for `script/**`
# would move the deployed bytes while leaving that artifact byte-identical, and
# an acceptance that compares artifact hashes would see nothing.
via_ir = true

# ── TOOLCHAIN PINS ────────────────────────────────────────────────────────
#
# ⚠️ These three lines are the difference between a gas number that means
# something and one that means nothing. None of them were set until
# 1 Sept 2026, and all three silently followed whatever `forge` happened to
# be installed. That is how CI's `contracts` job went red and stayed red.
#
# WHAT HAPPENED, measured 1 Sept 2026 from the CI logs themselves:
#   * 26 Aug 23:44 -- last green contracts job: forge 1.7.1, solc 0.8.35,
#     1279/1279 pass.
#   * 27 Aug 12:30 -- foundry v1.8.0 published.
#   * 27 Aug 12:37 -- next CI run, SEVEN MINUTES later: forge 1.8.0,
#     solc 0.8.36, 9 failures. No commit of ours touched any of it.
# The workflow asked foundry-toolchain for "stable" and got a new one.
#
# WHY `isolate` IS THE ONE THAT MATTERS. forge 1.8 flipped its default from
# false to true. In isolate mode every top-level call from a test is executed
# as its OWN transaction, so it pays the 21_000 intrinsic gas an inner call
# never pays. Measured on this tree, same solc, same evm_version, only the
# flag moved:
#       getFeeBps()            5_353 -> 31_417   (+26_064)
#       notifyWorkHandedIn()  11_446 -> 37_510   (+26_064)
#       creditDisputeFee()    56_718 -> 82_958   (+26_240)
#       updateStatus()        58_543 -> 83_115   (+24_572)
# Not one call got dearer. The harness started charging every measurement for
# a transaction that does not exist in production: Agreement reaches the
# diamond by an INNER call, inside a transaction already running. So `false`
# is the model that matches the thing being measured, and every cap literal
# in test/DiamondDeathGasCaps.t.sol was hand-derived under it.
#
# ⚠️ `false` is NOT free of consequence, and this is written down rather than
# left to be rediscovered: section 15 of that file spends SHIPPED budgets
# (relay.ts gas limits) on TOP-LEVEL calls, and a real relayer transaction
# does pay the intrinsic 21_000. For those tests isolate=true is the honest
# model, and under it testBurningFaultNoticeCannotBlockActivationTimeout
# fails -- i.e. the shipped 210_000 limit on triggerActivationTimeout() may
# not survive a gas-burning fault notice. That is an open question about a
# live budget, NOT something to settle by choosing a flag, and it is carried
# on the open list rather than closed here.
#
# `solc` is pinned to what the CHAIN actually runs, not to the newest that
# compiles. Read from Base Sepolia on 1 Sept 2026: the Agreement
# implementation deployed by the 31 Aug cut (0x5863fac3...) ends in
# `64736f6c6343 00081f` -- solc 0.8.31. CI was compiling 0.8.36 and measuring
# bytecode that exists nowhere.
#
# `evm_version` is pinned because forge 1.8 moved its default from "prague"
# to "osaka". The deployed bytecode above was built under prague, and Base
# has not been assumed to accept osaka opcodes.
solc = "0.8.31"
evm_version = "prague"
isolate = false

# ── REPRODUCIBLE BYTES FOR A STRANGER ────────────────────────────────────────
#
# ⚠️ CHANGING THIS LINE MOVES EVERY BYTECODE IN THE TREE, AND WITH IT EVERY
# CREATE2 ADDRESS DERIVED FROM ONE. That is a CUT, not a repair. The owner
# decided it on 8 October 2026 and it was already named as the next planned
# cut's job on 4 October (test/AgreementRendererWiring.t.sol).
#
# WHY. The public showcase repository exists so that a stranger can clone it,
# run `forge build` and get THE SAME BYTES as the chain carries. With solc's
# default metadata hash he cannot: the hash covers the metadata JSON, the JSON
# keys its `sources` by path, and the path depends on where the tree was
# checked out. Measured in test/AgreementRendererWiring.t.sol: the same
# AgreementRenderer source builds to 0x9b7afd… under one root and 0x47185d…
# under another, which is why that file has been red in CI and green locally.
# Four other settings were tried first (remappings pinning among them) and not
# one of them closed it.
#
# A fixed-path container WOULD close it and was REJECTED by the owner, for the
# reason that matters more than the badge: it keeps the "full match" marker at
# the price of the goal itself — reproducible only THROUGH US is not
# reproducible.
#
# WHAT IS LOST, said out loud rather than left to be discovered. Sourcify and
# Etherscan's "full match" needs the metadata hash to resolve to the metadata
# JSON; with no hash in the bytecode they can only reach a "partial match"
# (the executable bytes agree, the metadata is not pinned). That is the trade
# the owner took: a weaker badge from one website, a stronger guarantee for
# anybody with a shell.
#
# WHAT IS *NOT* LOST. `solc` stays in the tail — with `bytecode_hash = "none"`
# solc still appends the CBOR `{"solc": <version>}`, so the compiler version is
# still readable off chain, and it is pinned above anyway. The tail shrinks
# from 53 bytes to about a dozen. The house rule for comparing bytecode has
# always READ that length out of the tail's own last two bytes and never
# written it down -- `_hashWithoutMetadata` in
# test/AgreementRendererWiring.t.sol and `strip_metadata` in
# script/verify_cut_addresses.py are both in this repository and both do it --
# so the shrinking is survivable BY DESIGN, and that was measured after this
# edit rather than assumed.
bytecode_hash = "none"

# The AST is emitted into the artifacts (out/<File>.sol/<Contract>.json, key
# "ast") because a build gate reads sources through solc's tree rather than
# through regular expressions: a `msg.sender` inside a comment is then never
# mistaken for a real one, and every real one is tied to the function holding
# it.
#
# It lives here rather than behind an `--ast` flag on the gate itself, and
# that is deliberate: the flag set feeds the compiler settings hash, so a run
# without the AST and a later build with it would invalidate each other's
# cache, and every switch would cost a full via-ir rebuild (~3 minutes). With
# `ast = true` every build carries it and nothing is ever rebuilt. Bytecode is
# unaffected.
ast = true

# The storage layout is emitted into the same artifacts (key "storageLayout")
# because test/AgreementStorageLayout.t.sol reads it: the layout of an
# EIP-1167 implementation is nailed to every clone ever made from it, so a
# reordered or retyped field is unfixable for deals that already exist, and
# until now the only lock over it was a shell script outside the suite.
#
# It has to live here rather than behind the gate's `forge inspect --json`,
# for two reasons. Without it a plain `forge build` -- which is what
# `forge test` runs -- writes an artifact with NO storageLayout key at all
# (measured 31 Aug 2026: append one comment to src/Agreement.sol, run
# `forge build`, and the key is gone), so the test would have nothing to
# read. And, exactly like `ast` above, the requested output feeds the
# compiler settings hash: while the layout was requested only by the gate,
# `forge inspect` and `forge build` invalidated each other's cache, which is
# how check-agreement-layout.sh came back with "storage layout missing from
# artifact" (exit 3 -- layout NOT checked) on 31 Aug. Requested by every
# build, nothing thrashes: measured after the change, `forge build` right
# after a gate run takes 1.2s instead of rebuilding. Bytecode is unaffected;
# changing this line costs one full via-ir rebuild (~9 minutes on this
# machine).
extra_output = ["storageLayout"]

# test/DeployFullSelectors.t.sol reads compiled ABI artifacts (out/<Facet>.sol/<Facet>.json)
# to derive ground-truth selectors for the DeployFull.s.sol drift gate — read-only,
# scoped to the build output directory only.
#
# ./test/fixtures holds a census of the live chain. The artifact under ./out
# answers what this code is able to do; the census answers which selectors are
# mounted on the diamond today, and the second does not follow from the first.
# Both paths are read-only and both stay inside the repository.
#
# ./test/legacy holds the frozen snapshot of the shipped arbiter facet. Its lock
# (test/PresentationRecordUpgrade.t.sol, test_LegacyTwinSourceIsFrozen) hashes the
# snapshot's SOURCE with comments stripped, which the compiler's own
# metadata.sources[...] hash cannot answer: that one covers the whole text,
# comments included. Read-only, inside the repository, like the two above.
#
# ./src answers a question none of the three above can, and only one lock asks
# it: "is there anything in this tree that spends the arbiter payroll pot".
# That is a claim about a function which DOES NOT EXIST, and no call proves an
# absence -- an ABI says what the code can do, never what it cannot. The lock
# (test/TreasuryLinkUpgrade.t.sol, test_TheStreamFillsAPotThatStillHasNoDoor)
# enumerates every .sol under ./src and finds the pot's field in exactly the two
# files that hold it today, so the day decision 73's payout is written the test
# goes red and its author has to come and say so. Read-only, inside the
# repository, and the same source the compiler already read.
#
# ./broadcast holds forge's own receipts for every script that was ever
# broadcast from this machine, and it answers the one question no file inside
# the repository can: HAS A CUT BEEN SIGNED SINCE THE CENSUS WAS READ. A census
# is a picture with a block number on it; a receipt is a block number the tool
# wrote, not a person, and nobody edits it. test/CensusFreshness.t.sol compares
# the two, so "the owner signed a cut and nobody re-read the census" stops being
# a silence and becomes a red.
#
# ⚠️ ./broadcast IS GITIGNORED (.gitignore:38). On the machine where cuts are
# actually signed it is present and the lock measures; on a fresh clone and in
# CI it is absent and the lock SKIPS rather than passes, because "did not look"
# must not read as "looked and was happy". Read-only, like the four above.
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./src" },
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "./test/legacy" },
    { access = "read", path = "./broadcast" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# ── FUZZ SEED: PINNED 13 OCTOBER 2026, AND WHAT IT COSTS ──────────────────────
#
# Until today there was no [fuzz] section at all, so every run drew fresh
# inputs. That has one consequence nobody chose:
#
#   A COUNTEREXAMPLE FOUND ON ONE MACHINE COULD NEVER REACH ANOTHER. forge
#   saves a failing input to cache/fuzz/failures/<Suite>/<test>, and cache/ is
#   in .gitignore with zero files tracked. The lock fired, wrote down what it
#   found, and the finding died on that disk. Measured: one such file sits
#   here, written 12 October at 20:42 for DiamondTest::testFuzzDeployAgreement.
#   Five runs of that test today pass on the saved input, so something fixed
#   it -- and nothing anywhere records what, because nobody else ever saw the
#   input. Carried in the working journal as item 299. (The journal itself does
#   not travel to the public showcase, so only the number is named here: a path
#   would be a dead link for every reader there.)
#
# ⚠️ WHAT PINNING BUYS AND WHAT IT SPENDS, both out loud. It buys a red that
# is the SAME red on every machine: a fuzz failure can be handed to somebody
# else by naming the test, and they will see it. It spends exploration -- the
# fuzzer now walks the same inputs every run and will not stumble on a new
# one by chance. Four fuzz tests, no invariant tests, so the surface given up
# is small and the reproducibility is worth more here.
#
# ⚠️ AND THE HONEST CONSEQUENCE OF THAT TRADE: a pinned fuzzer stops being a
# search. It is a fixed set of cases wearing a fuzzer's clothes. New ground is
# covered by somebody writing a case on purpose, not by the dice -- so when a
# fuzz test is the only cover for a rule, that is now a hand-written gap, not
# a machine that will eventually get there.
#
# ⚠️ AND WHAT IT DOES NOT BUY, MEASURED RATHER THAN ASSUMED. Pinning the seed
# makes a run reproducible AT THE SAME CONCURRENCY, not everywhere. Measured
# 13 October 2026 on one deliberately-failing fuzz test, cache/fuzz cleared
# before every run so the replay could not do the work instead of the seed:
#
#       forge test -j 1          3 runs, same input every time
#       forge test  (default)    3 runs, same input every time
#       the two sets             DIFFERENT inputs from each other
#
# `-j` defaults to the core count, so two machines with different cores walk
# different inputs even with the same seed. Handing somebody a failing test by
# name therefore works on the same machine and may not across machines unless
# they also match `-j`. Pinning `-j 1` as well would close that and was not
# done: the suite is 134 files and single-threading it costs far more than the
# gap is worth.
#
# ⚠️ ONE RUN REFUSED TO FIT, AND IT IS WRITTEN DOWN RATHER THAN EXPLAINED AWAY.
# The very first run of that experiment produced a different input from the
# eight that followed, including runs after a forced recompile. No hypothesis
# tested reproduced it. The honest statement is that eight runs agree and one
# did not, and nobody knows why.
#
# The number is the date the decision was taken. It means nothing arithmetically
# and is not supposed to: any constant does the job, and a date says when the
# exploration stopped.
[profile.default.fuzz]
seed = "20261013"

